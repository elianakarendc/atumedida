<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A TU MEDIDA - Moda Femenina</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Encabezado principal -->
  <header class="header">
    <div class="header-container">
      <h1 class="logo">A TU MEDIDA</h1>
      
      <div class="search-bar">
        <input type="text" placeholder="Buscar..." aria-label="Buscar productos">
      </div>

      <nav class="nav">
        <ul class="nav-list">
          <li><a href="#inicio" class="nav-link">Inicio</a></li>
          <li><a href="#nosotros" id="btn-nosotros" class="nav-link">Nosotros</a></li>
          <li><a href="#productos" id="btn-productos" class="nav-link">Productos</a></li>
          <li><a href="#contacto" class="nav-link">Contacto</a></li>
        </ul>
      </nav>

      <button id="btn-login" class="btn-login">Iniciar Sesión</button>
    </div>
  </header>

  <!-- Contenido principal -->
  <main>
    <!-- Hero / Banner Principal -->
    <section id="inicio" class="hero">
      <div class="hero-overlay"></div>
      <img src="./images/portada.image1.png" alt="Banner principal de colección" class="hero-img">
      <div class="hero-content">
        <button id="btn-ver-coleccion" class="btn-primary">VER COLECCIÓN</button>
      </div>
    </section>

    <!-- Sección de Mensaje / Propuesta de Valor -->
    <section id="nosotros" class="value-prop">
      <h2>Vístete como te gusta, sin límites</h2>
      <p>Moda para mujeres que quieren sentirse cómodas, bonitas y seguras.</p>
    </section>

    <!-- Sección de Productos / Categorías -->
    <section id="productos" class="catalog">
      <div class="catalog-grid">
        
        <article class="product-card">
          <div class="card-image-wrapper">
            <img src="./images/vestido.imagen1.png" alt="Vestido largo acanalado">
          </div>
          <div class="card-footer">
            <h3>Vestidos</h3>
          </div>
        </article>

        <article class="product-card">
          <div class="card-image-wrapper">
            <img src="./images/images.pantalones2.png" alt="Pantalón beige con blusa guinda">
          </div>
          <div class="card-footer">
            <h3>Pantalones</h3>
          </div>
        </article>

        <article class="product-card">
          <div class="card-image-wrapper">
            <img src="./images/blusas.images3.png" alt="Blusa rosada con lazo">
          </div>
          <div class="card-footer">
            <h3>Blusas</h3>
          </div>
        </article>

      </div>
    </section>
  </main>

  <!-- Pie de página -->
  <footer id="contacto" class="footer">
    <p>&copy; 2026 A TU MEDIDA. Todos los derechos reservados.</p>
  </footer>

  <!-- Modal / Diálogo de Inicio de Sesión -->
  <div id="modal-login" class="modal" aria-hidden="true">
    <div class="modal-content">
      <span id="close-modal" class="close-btn">&times;</span>
      <h3>Iniciar Sesión</h3>
      <form id="form-login">
        <div class="form-group">
          <label for="email">Correo Electrónico:</label>
          <input type="email" id="email" required placeholder="tu@email.com">
        </div>
        <div class="form-group">
          <label for="password">Contraseña:</label>
          <input type="password" id="password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn-primary">Entrar</button>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
